version : '3.8'

services:
  backend:
    build: ./backend
    container_name: faebery-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - faebery-network

  frontend:
    build: ./frontend
    container_name: faebery-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - faebery-network

networks:
  faebery-network:
    driver: bridge